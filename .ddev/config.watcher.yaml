#ddev-generated
# Storefront & admin hot-reload watchers for shopware-cli, wired for DDEV.
#
# Targets Shopware 6.7.4.2+ (Vite-based admin watcher on port 5173). If you run
# an older Shopware, swap the values below for the matching block — see README.md
# ("Older Shopware versions") for the 6.7.0–6.7.4.1 and 6.5/6.6 variants.
#
# Run the watchers from the host (DDEV executes them in the web container):
#   ddev admin-watch custom/static-plugins/<Plugin>   # administration (Vite)
#   ddev storefront-watch                             # storefront
#
# After editing this file, run `ddev restart` so the ports/env take effect.
# Always reach the watchers via your primary DDEV URL (https://<project>.ddev.site),
# never localhost.
web_environment:
    - HOST=0.0.0.0
    - PROXY_URL=${DDEV_PRIMARY_URL}:9998
    - STOREFRONT_SKIP_SSL_CERT=true
web_extra_exposed_ports:
    - name: vite-admin
      container_port: 5173
      http_port: 5172
      https_port: 5173
    - name: storefront-proxy
      container_port: 9998
      http_port: 8888
      https_port: 9998
    - name: storefront-assets
      container_port: 9999
      http_port: 8889
      https_port: 9999
