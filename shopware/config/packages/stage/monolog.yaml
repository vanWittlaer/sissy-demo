parameters:
  env(MONOLOG_LOG_LEVEL): "warning"
  # Set per service in compose (web / worker / scheduler).
  env(LOG_FILE): "app"
monolog:
    handlers:
        main:
            type: fingers_crossed
            action_level: "%env(MONOLOG_LOG_LEVEL)%"
            handler: nested
            excluded_http_codes: [404, 405]
            buffer_size: 50
        # Keeps the name "nested" so core's prod rotating_file handler stays
        # overridden rather than re-entering the stack alongside this one.
        nested:
            type: group
            members: [stderr, logfile]
        stderr:
            type: stream
            path: php://stderr
            level: "%env(MONOLOG_LOG_LEVEL)%"
            formatter: monolog.formatter.json
        logfile:
            type: rotating_file
            path: "%kernel.logs_dir%/%kernel.environment%-%env(LOG_FILE)%.log"
            max_files: 14
            level: "%env(MONOLOG_LOG_LEVEL)%"
        console:
            type: console
            process_psr_3_messages: false
            channels: ["!event", "!doctrine"]
        business_event_handler_buffer:
            level: "%env(MONOLOG_LOG_LEVEL)%"
