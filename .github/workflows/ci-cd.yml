name: CI/CD

# Build and deploy come from the sissy platform repo, pinned to a major tag.
# This file owns only the policy: which branch builds and deploys what.

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default token scope; the build jobs widen to packages:write below
# (a called reusable workflow's token can't exceed the caller job's grant).
permissions:
  contents: read

jobs:
  build_stage:
    if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/feature')
    permissions:
      contents: read
      packages: write
    uses: vanWittlaer/sissy/.github/workflows/build-docker.yml@v1
    with:
      environment: stage
    secrets:
      BEARER_PACKAGES_SHOPWARE: ${{ secrets.BEARER_PACKAGES_SHOPWARE }}

  build_production:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: vanWittlaer/sissy/.github/workflows/build-docker.yml@v1
    with:
      environment: prod
    secrets:
      BEARER_PACKAGES_SHOPWARE: ${{ secrets.BEARER_PACKAGES_SHOPWARE }}

  # feature/** builds but never deploys — only develop and main reach a host.
  deploy_stage:
    if: github.ref == 'refs/heads/develop'
    needs: build_stage
    uses: vanWittlaer/sissy/.github/workflows/deploy-ssh.yml@v1
    with:
      environment: stage
      stack: stage
      tag: ${{ needs.build_stage.outputs.tag }}
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

  deploy_production:
    if: github.ref == 'refs/heads/main'
    needs: build_production
    uses: vanWittlaer/sissy/.github/workflows/deploy-ssh.yml@v1
    with:
      environment: prod
      stack: prod
      tag: ${{ needs.build_production.outputs.tag }}
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
