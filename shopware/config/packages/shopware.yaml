parameters:
    # Overridden per stack in .env.local; prod turns it off.
    env(SHOPWARE_UPDATE_MAIL_VARIABLES): '1'

shopware:
    admin_worker:
        enable_admin_worker: false
    mail:
        update_mail_variables_on_send: '%env(bool:SHOPWARE_UPDATE_MAIL_VARIABLES)%'
    increment:
        # Drop the per-request DB writes; the data is only admin telemetry.
        user_activity:
            type: 'array'
        message_queue:
            type: 'array'
    staging:
        mailing:
            # Default true would stop stage sending mail once core.staging is on.
            # Stage's MAILER_DSN points at a catch-all, so let it send.
            disable_delivery: false
        sales_channel:
            # Applied by `system:setup:staging`, which only ever runs on stage.
            # prefix, not equal: the rule must survive a path on the stored URL.
            domain_rewrite:
                - type: prefix
                  match: 'https://www.sissy.my-demo.shop'
                  replace: 'https://staging.sissy.my-demo.shop'
